# Production-shaped local stack (§30, §31).
#
# The same file runs in production with a populated .env; nothing here is
# development-only except the published MySQL port, which is commented out.
#
#   docker compose up -d --build
#   docker compose --profile edge up -d --build   # adds Nginx in front

name: portfolio

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-portfolio}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      # The schema and seed content are applied by the API when it starts (see
      # backend/internal/database/migrate.go), so MySQL starts empty here.
      - db_data:/var/lib/mysql
    # The database is only reachable from the compose network. Uncomment to
    # inspect it from the host during development.
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  api:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: '8080'
      DB_ENABLED: 'true'
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-portfolio}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # First admin account, created only while there are none.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1h}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      # Session cookies must carry Secure in production; the config refuses to
      # start with APP_ENV=production and this set to false.
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      MAX_ADMIN_BODY_BYTES: ${MAX_ADMIN_BODY_BYTES:-262144}
      # The API sits behind the Nuxt server, which sets X-Real-IP.
      TRUSTED_PROXY: 'true'
    depends_on:
      db:
        condition: service_healthy
    # Deliberately no published port: only the web service talks to the API.
    expose:
      - '8080'
    networks:
      - internal

  web:
    build:
      context: ./frontend
      args:
        # Baked into prerendered canonical tags — must be the real origin.
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?NUXT_PUBLIC_SITE_URL is required}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_API_BASE_URL: http://api:8080
      NUXT_PUBLIC_CONTACT_ENABLED: ${NUXT_PUBLIC_CONTACT_ENABLED:-true}
      NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Bound to loopback: Nginx or Cloudflare Tunnel terminates TLS in front.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    profiles: ['edge']
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
